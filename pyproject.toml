[project]
name = "structural-bioinformatics"
version = "0.1.0"
description = "Teaching materials for the course: Structural Bioinformatics"
authors = [{ name = "Yerko Escalona", email = "35448591+yerkoescalona@users.noreply.github.com" }]
requires-python = ">=3.12,<3.13"
license = { text = "CC BY-NC-SA 4.0" }
readme = "README.md"
dependencies = [
    "biopandas==0.4.1",
    "ipykernel>=6.29.5",
    "jupyter==1.1.1",
    "matplotlib==3.10.0",
    "mdanalysis>=2.10.0",
    # Declared but never imported by any notebook (confirmed via grep across
    # ex00-ex04, 2026-08-08) and the only dependency here with no pip wheel
    # (sdist only, per PLAN-environment.md Task 2) -- kept, not removed, pending
    # that file's own open "source of truth" decision. Pinned to match
    # environment.yml (3.1.2), not this file's previous stale 4.0.
    "nglview==3.1.2",
    "numpy==2.0.2",
    "openmm==8.2.0",
    "pandas==2.2.2",
    "py3dmol==2.4.0",
    "pypdb==2.4",
    "rdkit==2024.3.5",
    # environment.yml also pins 1.16.1; ex01's own Colab install cell pins
    # 1.16.2 instead (PLAN-environment.md Task 2, still open) -- not resolved
    # here, this file just stays consistent with environment.yml.
    "scipy==1.16.1",
    "tqdm==4.66.6",
    "biopython>=1.84",
    "tensorflow>=2.20.0",
    "jax>=0.5.3",
    "dm-tree>=0.1.8",
    "dm-haiku>=0.0.13",
    "absl-py>=2.1.0",
    "jmp>=0.0.4",
    "ml-collections>=0.1.1",
    "tabulate>=0.9.0",
    "six>=1.16.0",
    # Used by ex00/ex01/ex03 and pip-installed inside ex01's notebook
    # (`!pip install plotly==5.24.1`), but absent from environment.yml -- a
    # real, live-confirmed gap (PLAN-environment.md Task 2), not resolved
    # here either. Version matches the notebook's own install cell.
    "plotly==5.24.1",
    # Not imported or pip-installed anywhere (confirmed via grep across
    # ex00-ex04, 2026-08-08; ex03 only mentions it in a markdown cell as a
    # "you could also use" pointer). Kept, not removed, same "leave and note"
    # treatment as nglview above rather than a unilateral removal.
    "mdtraj>=1.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1",
    "pytest>=8.4.2",
    "pre-commit>=4.3.0",
    "nbstripout>=0.8.1",
    "commitizen>=3.29.0",
]

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
