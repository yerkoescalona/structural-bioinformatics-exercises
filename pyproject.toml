[project]
name = "structural-bioinformatics"
version = "0.1.0"
description = "Teaching materials for the course: Structural Bioinformatics"
authors = [{ name = "Yerko Escalona", email = "r207499@fhwn.ac.at" }]
requires-python = ">=3.13,<3.14"
license = { text = "CC BY-NC-SA 4.0" }
readme = "README.md"
dependencies = [
    "biopandas==0.4.1",
    "ipykernel>=6.29.5",
    "jupyter==1.1.1",
    "matplotlib==3.10.0",
    "mdanalysis>=2.10.0",
    "numpy==2.1.3",
    "openmm==8.2.0",
    "pandas==2.2.3",
    "py3dmol==2.4.0",
    "pypdb==2.4",
    "rdkit==2026.3.5",
    # Matches Colab exactly (2026-08-29). This previously disagreed three ways
    # -- 1.16.1 here, 1.16.2 in ex01's install cell, 1.16.3 on Colab -- which is
    # the drift PLAN-environment.md Task 2 tracked by hand.
    "scipy==1.16.3",
    "tqdm==4.67.3",
    "biopython>=1.84",
    "tensorflow>=2.20.0",
    "jax>=0.5.3",
    "dm-tree>=0.1.8",
    "dm-haiku>=0.0.13",
    "absl-py>=2.1.0",
    "jmp>=0.0.4",
    "ml-collections>=0.1.1",
    "tabulate>=0.9.0",
    "six>=1.16.0",
    # Used by ex00/ex01/ex03. Matches both the notebooks' install cells and
    # Colab's own version (5.24.1), so installing it is a no-op on Colab.
    "plotly==5.24.1",
    # Not imported or pip-installed anywhere (confirmed via grep across
    # ex00-ex04, 2026-08-08; ex03 only mentions it in a markdown cell as a
    # "you could also use" pointer). Kept for now -- unlike nglview it does have
    # a cp313 wheel, so it costs nothing on the current runtime.
    "mdtraj>=1.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1",
    "pytest>=8.4.2",
    "pre-commit>=4.3.0",
    "nbstripout>=0.8.1",
    "commitizen>=3.29.0",
]

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
