# Ruff configuration for Structural Bioinformatics project

# Target Python version
target-version = "py312"

# Line length (same as Black default)
line-length = 88

# Directories to exclude from linting
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
]

[lint]
# Rule selection - only enable specific rule categories
select = [
    "E4",  # Import related errors
    "E7",  # Indentation errors
    "E9",  # Hanging indentation
    "F",   # Pyflakes
    "D",   # Docstring checks
    "ANN", # Type annotations: every helper says what goes in and what comes out
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# A notebook is not a module. Redefinition across cells is normal, and the install cell
# has to run before anything can be imported, so imports are never at the top.
"**/*.ipynb" = ["F811", "E402"]

# Workbooks carry instructions only: students paste the guide's install and imports cells
# into their own copy. If such a cell ever reaches a workbook, its imports read as unused
# until the student's code uses them. Do NOT let --fix strip them.
"**/*_workbook.ipynb" = ["F811", "E402", "F401"]

[lint.pydocstyle]
# Use Google docstring convention
convention = "google"